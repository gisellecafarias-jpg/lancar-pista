<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lançar Pista</title>

<!-- Nome e ícone na tela inicial (iPhone e Android) -->
<meta name="apple-mobile-web-app-title" content="Lançar Pista">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1b27a8">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon-32.png">
<link rel="manifest" href="manifest.json">

<style>
  :root { --hero1: #1b27a8; --hero2: #4256f0; --ok: #16a36e; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    color: #fff; background: linear-gradient(135deg, var(--hero1), var(--hero2));
    display: flex; align-items: center; justify-content: center; padding: 24px 16px;
  }
  main { width: 100%; max-width: 420px; text-align: center; }
  .icone { width: 120px; height: 120px; border-radius: 28px; box-shadow: 0 12px 30px rgba(0,0,0,.25); }
  h1 { font-size: 30px; margin: 18px 0 4px; letter-spacing: -.02em; }
  p.sub { margin: 0 0 26px; color: rgba(255,255,255,.8); }
  a.abrir {
    display: block; background: #fff; color: var(--hero1); text-decoration: none; font-weight: 700;
    font-size: 18px; padding: 16px; border-radius: 14px; box-shadow: 0 8px 20px rgba(0,0,0,.2);
  }
  .passos {
    margin-top: 26px; text-align: left; background: rgba(255,255,255,.12); border-radius: 16px; padding: 16px 18px;
    font-size: 15px; line-height: 1.5;
  }
  .passos b { color: #fff; }
  .passos ol { margin: 8px 0 0; padding-left: 20px; }
  .carregando { display: none; margin-top: 18px; color: rgba(255,255,255,.85); }
</style>
</head>
<body>
<main>
  <img class="icone" src="apple-touch-icon.png" alt="">
  <h1>Lançar Pista</h1>
  <p class="sub">Comprovantes da Pista de Gelo de Maricá</p>

  <a class="abrir" id="abrir" href="#">＋ Lançar comprovante</a>
  <p class="carregando" id="carregando">Abrindo…</p>

  <div class="passos" id="passos">
    <b>Coloque na tela inicial do celular:</b>
    <ol id="lista"></ol>
  </div>
</main>

<script>
  // Link do App da Web (Apps Script). Se a implantação mudar, troque só aqui.
  const APP = 'https://script.google.com/macros/s/AKfycbxKiQzHUvUVCdFuxRwFvmEJzxHQuNPDIzblHgbfUgLolVr18yQN1m8jSNP5ryC26URE/exec';

  document.getElementById('abrir').href = APP;

  const naTelaInicial = window.navigator.standalone === true ||
    window.matchMedia('(display-mode: standalone)').matches;
  const iphone = /iPhone|iPad|iPod/i.test(navigator.userAgent);

  if (naTelaInicial) {
    // aberto pelo ícone da tela inicial: vai direto para o app
    document.getElementById('passos').style.display = 'none';
    document.getElementById('carregando').style.display = 'block';
    window.location.replace(APP);
  } else {
    document.getElementById('lista').innerHTML = iphone
      ? '<li>Toque no botão <b>Compartilhar</b> do Safari (quadrado com seta).</li>' +
        '<li>Role e toque em <b>Adicionar à Tela de Início</b>.</li>' +
        '<li>Toque em <b>Adicionar</b>. Pronto: o ícone já vem com o nome e a imagem.</li>'
      : '<li>No Chrome, toque no menu <b>⋮</b>.</li>' +
        '<li>Toque em <b>Adicionar à tela inicial</b> (ou <b>Instalar app</b>).</li>' +
        '<li>Confirme. O ícone já vem com o nome e a imagem.</li>';
  }
</script>
</body>
</html>
